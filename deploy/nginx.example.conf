server {
    listen 443 ssl;
    server_name <your-domain>;
    # ssl_certificate ... ; ssl_certificate_key ... ;

    # Claude Code - index page
    location = /claude/ {
        root /usr/share/nginx/html;
        try_files /claude/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Claude Code - WebSocket relay
    location ~ ^/claude/[^/]+/ws$ {
        proxy_pass http://172.17.0.1:7691;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # relay-server throttles failed logins per IP; without these it only ever
        # sees 127.0.0.1 (the frp tunnel) and one bad password locks everyone out.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Claude Code - redirect /claude/{project} to /claude/{project}/
    location ~ ^/claude/[^/]+$ {
        return 301 $uri/;
    }

    # Claude Code - terminal pages
    location ~ ^/claude/[^/]+/$ {
        root /usr/share/nginx/html;
        try_files /claude/terminal.html =404;
        add_header Cache-Control "no-cache";
    }

    # File server API
    location /files/ {
        proxy_pass http://172.17.0.1:7690/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

}
